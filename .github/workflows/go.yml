# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22.2'

    - name: Build Account service
      run: go build -v ./services/account

    - name: Build Assertions service
      run: go build -v ./services/assertion
    
    - name: Build Gateway service
      run: go build -v ./services/gateway
    
    - name: Build Store service
      run: go build -v ./services/store

    - name: Test
      run: go test -v ./services/account ./services/assertion ./services/gateway ./services/store

