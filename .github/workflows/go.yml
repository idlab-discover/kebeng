name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "*" ]

jobs:
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      account_changed: ${{ steps.account_changed_files.outputs.any_changed }}
      assertion_changed: ${{ steps.assertion_changed_files.outputs.any_changed }}
      gateway_changed: ${{ steps.gateway_changed_files.outputs.any_changed }}
      store_changed: ${{ steps.store_changed_files.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Get changed files in account service
        id: account_changed_files
        uses: tj-actions/changed-files@v45
        with:
          files: services/account/**
      
      - name: Get changed files in assertion service
        id: assertion_changed_files
        uses: tj-actions/changed-files@v45
        with:
          files: services/assertion/**
      
      - name: Get changed files in gateway service
        id: gateway_changed_files
        uses: tj-actions/changed-files@v45
        with:
          files: services/gateway/**

      - name: Get changed files in store service
        id: store_changed_files
        uses: tj-actions/changed-files@v45
        with:
          files: services/store/**

  build_and_test:
    runs-on: ubuntu-latest
    needs: detect_changes
    strategy:
      matrix:
        service: [account, assertion, gateway, store]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22.2'

      - name: Build & Test ${{ matrix.service }} service
        if: needs.detect_changes.outputs[format('{0}_changed', matrix.service)] == 'true'
        working-directory: services/${{ matrix.service }}
        run: |
          go build -v ./...
          go test -cover ./...
