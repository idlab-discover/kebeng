name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22.2'

    - name: Check for changes in Account service
      id: account
      run: |
        if git diff --quiet HEAD^ HEAD -- services/account; then
          echo "account_service_changed=false" >> $GITHUB_ENV
        else
          echo "account_service_changed=true" >> $GITHUB_ENV
        fi

    - name: Build & Test Account service
      if: env.account_service_changed == 'true'
      working-directory: ./services/account
      run: |
        go build -v ./
        go test -v ./...

    - name: Check for changes in Assertion service
      id: assertion
      run: |
        if git diff --quiet HEAD^ HEAD -- services/assertion; then
          echo "changed=false" >> $GITHUB_ENV
        else
          echo "changed=true" >> $GITHUB_ENV
        fi

    - name: Build & Test Assertion service
      if: env.changed == 'true'
      working-directory: ./services/assertion
      run: |
        go build -v ./
        go test -v ./...

    - name: Check for changes in Gateway service
      id: gateway
      run: |
        if git diff --quiet HEAD^ HEAD -- services/gateway; then
          echo "changed=false" >> $GITHUB_ENV
        else
          echo "changed=true" >> $GITHUB_ENV
        fi

    - name: Build & Test Gateway service
      if: env.changed == 'true'
      working-directory: ./services/gateway
      run: |
        go build -v ./
        go test -v ./...

    - name: Check for changes in Store service
      id: store
      run: |
        if git diff --quiet HEAD^ HEAD -- services/store; then
          echo "changed=false" >> $GITHUB_ENV
        else
          echo "changed=true" >> $GITHUB_ENV
        fi

    - name: Build & Test Store service
      if: env.changed == 'true'
      working-directory: ./services/store
      run: |
        go build -v ./
        go test -v ./...
