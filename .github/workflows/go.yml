name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22.2'
    
      - name: Get changed files
        id: account_changed_files
        uses: tj-actions/changed-files@v45
        with:
          files: services/account/**
      
      - name: Print changed files boolean
        run: echo "${{ steps.account_changed_files.outputs.any_changed }}"
