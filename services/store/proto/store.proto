syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "common/cerror/proto/error.proto";

package store;
option go_package = "github.com/idlab-discover/kebeng/services/store/proto;store";

service StoreService {
    rpc RegisterSnapName(RegisterSnapNameRequest) returns (RegisterSnapNameResponse);
    rpc GetRevisions(GetRevisionsRequest) returns (GetRevisionsResponse);
    rpc GetEntries(GetEntriesRequest) returns (GetEntriesResponse);
    rpc GetEntriesByAccountId(GetEntriesByAccountIdRequest) returns (GetEntriesResponse);
    rpc GetEntriesByQuery(GetEntriesByQueryRequest) returns (GetEntriesResponse);
    rpc GetRevisionsByEntryIds(GetRevisionsByEntryIdRequests) returns (GetRevisionsByEntryIdResponses);
    rpc GetLatestRevisionByTrackAndChannel(GetLatestRevisionRequest) returns (GetRevisionResponse);
    rpc SnapDownload(SnapDownloadRequest) returns (stream SnapDownloadResponse);
    rpc UnscannedUpload(stream UnscannedUploadRequest) returns (UnscannedUploadCompleteResponse);
    rpc AddUpload(AddUploadRequest) returns (AddUploadResponse);
    rpc GetUploadStatus(GetUploadStatusRequest) returns (GetUploadStatusResponse);
    rpc AddRevision(AddRevisionRequest) returns (AddRevisionResponse);
    rpc GetObjectCustomMetadata(GetObjectCustomMetadataRequest) returns (GetObjectCustomMetadataResponse);
    rpc UpdateUploadStatus(UpdateUploadStatusRequest) returns (UpdateUploadStatusResponse);
    rpc UpdateSnapEntryWithMetadata(UpdateSnapEntryWithMetadataRequest) returns (UpdateEntryResponse);
}

message RegisterSnapNameRequest {
    string snap_name = 1;
    bool isPrivate = 2;
    string store = 3;
    bool dry_run = 4;
    string account_id = 5;
    string snap_type = 6;
    string confinement = 7;
    string base = 8;
    string status = 9;
    double price = 10;
    string icon_url = 11;
}

message RegisterSnapNameResponse {
    string id = 1;
    string snap_name = 2;
    repeated proto.Error errors = 3;
}

message GetEntryRequest {
    optional string id = 1;
    optional string name = 2;
    repeated string preload_associations = 3;
}
// TODO: add snapComments
message GetEntryResponse {
    string id = 1;
    string snap_name = 2;
    string confinement = 3;
    string base = 4;
    string type = 5;
    bool private = 6;
    string publisher_id = 7;
    string status = 8;
    double price = 9;
    google.protobuf.Timestamp since = 10;
    string icon_url = 11;
    string version = 12;
    string grade = 13;
    string summary = 14;
    string description = 15;
    repeated GetRevisionResponse revisions = 16;
    repeated proto.Error errors = 17;
}



message GetEntriesRequest {
    repeated GetEntryRequest entries = 1;
}

message GetEntriesResponse {
    repeated GetEntryResponse entries = 1;
    repeated proto.Error errors = 2;
}

message GetRevisionRequest {
    string id = 1;
    string snap_name = 2;
    uint32 sequence = 3;
}

message GetRevisionResponse {
    string id = 1;
    google.protobuf.Timestamp created_at = 2;
    google.protobuf.Timestamp updated_at = 3;
    optional google.protobuf.Timestamp deleted_at = 4;
    string build_assertion_filename = 5;
    string sha3_384_encoded = 7;
    uint64 size = 8;
    uint32 sequence_number = 9;
    string snap_name = 10;
    repeated string architectures = 11;
    string status = 12;
    string version = 13;
    string entry_id = 14;
    string track_id = 15;
    string channel_id = 16;
    string branch_id = 17;
    
    repeated proto.Error errors = 18;
}

message GetRevisionsRequest {
    repeated GetRevisionRequest revisions = 1;
}

message GetRevisionsResponse {
    repeated GetRevisionResponse revisions = 1;
    repeated proto.Error errors = 2;
}


message GetEntriesByAccountIdRequest {
    string account_id = 1;
}

message GetEntriesByQueryRequest {
    string query = 1;
    repeated string architectureList = 2;
    repeated string channelList = 3;
    repeated string confinementsList = 4;
    repeated string fieldsList = 5;
    bool private = 6;
}

message GetRevisionsByEntryIdRequest {
    string entry_id = 1;
}

message GetRevisionsByEntryIdRequests {
    repeated GetRevisionsByEntryIdRequest requests = 1;
}

message GetRevisionsByEntryIdResponse {
    string entry_id = 1;
    repeated GetRevisionResponse revisions = 2;
    repeated proto.Error errors = 3;
}

message GetRevisionsByEntryIdResponses {
    repeated GetRevisionsByEntryIdResponse responses = 1;
    repeated proto.Error errors = 2;
}


message GetLatestRevisionRequest {
    string snap_name = 1;
    string track = 2;
    string channel = 3;
}

// ################### STREAMING #######################

message DataChunk {
    bytes chunk = 1;
}

// ################ END STREAMING #######################

//  ####################### START DOWNLOAD #######################
message SnapDownloadRequest {
    string revision_id = 1;
}

message InitialDownloadResponse {
    GetRevisionResponse revision = 1;
}

message SnapDownloadResponse {
    oneof payload {
      InitialDownloadResponse initial = 1;
      DataChunk data = 2;
    }
    repeated proto.Error errors = 3;
}

message SnapDownloadCompleteResponse {
    GetRevisionResponse revision = 1;
    bytes data = 2;
    repeated proto.Error errors = 3;
}

// ####################### END DOWNLOAD #######################

message SnapPushRequest {
    string snap_id = 1;
    string instance_key = 2;
    uint64 revision = 3;
    string track = 4;
    string channel = 5;
}

// ################## START UNSCANNED UPLOAD #######################

message UnscannedUploadRequest {
    oneof payload {
        InitialUnscannedUploadRequest initial = 1;
        DataChunk data = 2;
    }
    repeated proto.Error errors = 3;
}

message InitialUnscannedUploadRequest {
    string entry_name = 1;
}

// Already defined in Download
// message DataChunk {
//     bytes chunk = 1;
// }

message UnscannedUploadCompleteResponse {
    string temp_file_name = 1;
    uint64 size = 2;
    repeated proto.Error errors = 3;
}

// ################## END UNSCANNED UPLOAD #######################

message AddUploadRequest {
    string snap_name = 1;
    string entry_id = 2;
    string status = 3;
    string account_id = 4;
    string unscanned_file_name = 5;
    uint32 revision = 6;
}

message AddUploadResponse {
    string id = 1;
    string snap_name = 2;
    string status = 3;
    uint32 revision = 4;
    repeated proto.Error errors = 5;
}

message GetUploadStatusRequest {
    string upload_id = 1;
}

message GetUploadStatusResponse {
    string upload_id = 1;
    bool processed = 2;
    uint32 revision = 3;
    repeated proto.Error errors = 4;
}

message AddRevisionRequest {
    string snap_name = 1;
    string sha3_384_encoded = 2;
    uint64 size = 3;
    repeated string architectures = 4;
    repeated string tracks_and_channels = 5;
    string unscanned_file_name = 7;
}

message AddRevisionResponse {
    string id = 1;
    string snap_name = 2;
    string status = 3;
    uint32 revision = 4;
    repeated proto.Error errors = 5;
}

message GetObjectCustomMetadataRequest {
    string bucket = 1;
    string object_key = 2;
}

message GetObjectCustomMetadataResponse {
    string sha3_384_encoded = 1;
    string name = 2;
    string version = 3;
    string type = 4;
    string summary = 5;
    string description = 6;
    string confinement = 7;
    string base = 8;
    string grade = 9;
    repeated string architectures = 10;
    string plugs = 11;
    string slots = 12;
    repeated string refresh_control = 13;
    repeated proto.Error errors = 14;
}

message UpdateUploadStatusRequest {
    string upload_id = 1;
    string status = 2;
    uint32 revision = 3;
    repeated proto.Error errors = 4;
}

message UpdateUploadStatusResponse {
    string upload_id = 1;
    string status = 2;
    repeated proto.Error errors = 3;
}

message UpdateSnapEntryWithMetadataRequest {
    string entry_id = 1;
    string name = 2;
    string confinement = 3;
    string base = 4;
    repeated string architectures = 5;
    string grade = 6;
    string version = 7;
    string summary = 8;
    string description = 9;
    repeated proto.Error errors = 10;
}

message UpdateEntryResponse {
    string entry_id = 1;
    string name = 2;
    string type = 3;
    string confinement = 4;
    string base = 5;
    repeated string architectures = 6;
    string grade = 7;
    string version = 8;
    string summary = 9;
    string description = 10;
    bool private = 11;
    string status = 12;
    double price = 13;
    string store = 14;
    string icon_url = 15;
    string account_id = 16;
    google.protobuf.Timestamp created_at = 17;
    google.protobuf.Timestamp updated_at = 18;
    optional google.protobuf.Timestamp deleted_at = 19;
    repeated proto.Error errors = 20;
}
