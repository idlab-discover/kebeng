syntax = "proto3";

import "common/cerror/proto/error.proto";
import "google/protobuf/timestamp.proto";

package assertion;
option go_package = "github.com/idlab-discover/kebeng/services/assertion/proto;assertion";

service AssertionService {
    rpc ProcessSnapBuildAssertion(SnapBuildAssertionRequest) returns (SnapBuildAssertionResponse);
    rpc AddSnapRevisionAssertion(AddSnapRevisionAssertionRequest) returns (SnapRevisionAssertionResponse);
    rpc AddAccountKeyAssertion(AddAccountKeyAssertionRequest) returns (AccountKeyAssertionResponse);
    rpc AddSnapDeclarationAssertion(AddSnapDeclarationAssertionRequest) returns (SnapDeclarationAssertionResponse);
    rpc AddAccountAssertion(AddAccountAssertionRequest) returns (AccountAssertionResponse);
    rpc GetSnapRevisionAssertionBySHA3_384(GetSnapRevisionAssertionBySHA3_384Request) returns (SnapRevisionAssertionResponse);
    rpc GetAccountKeyAssertionByName(GetAccountKeyAssertionByNameRequest) returns (AccountKeyAssertionResponse);
    rpc GetSnapDeclarationAssertionBySnapID(GetSnapDeclarationAssertionBySnapIDRequest) returns (SnapDeclarationAssertionResponse);
    rpc GetAccountAssertionByAccountID(GetAccountAssertionByAccountIDRequest) returns (AccountAssertionResponse);
    
}

message SnapBuildAssertionRequest {
    bytes assertion = 1;
}

message SnapBuildAssertionResponse {
    string id = 1;
    string authority_id = 2;
    string grade = 3;
    string sign_key_sha3_384 = 4;
    string snap_id = 5;
    string snap_sha3_384 = 6;
    string snap_size = 7;
    string timestamp = 8;
    string revision = 9;
    string type = 10;
    string developer_id = 11;
    repeated proto.Error errors = 12;
}

message AddSnapRevisionAssertionRequest {
  string snap_sha3_384 = 1;
  string developer_id = 2;
  string snap_entry_id = 3;
  uint32 snap_revision_sequence_number = 4;
  uint64 snap_size = 5;
  google.protobuf.Timestamp timestamp = 6;
}

message SnapRevisionAssertionResponse {
  string authority_id = 1;
  string snap_sha3_384 = 2;
  string developer_id = 3;
  string snap_entry_id = 4;
  uint32 snap_revision_sequence_number = 5;
  uint64 snap_size = 6;
  google.protobuf.Timestamp timestamp = 7;
  string sign_key_sha3_384 = 8;
  string signature = 9;
  string type = 10;
  string id = 11;

  repeated proto.Error errors = 12;
}

message AddAccountKeyAssertionRequest {
  string encoded_public_key = 1;
  string public_key_sha3_384 = 2;
  string account_id = 3;
  string name = 4;
  google.protobuf.Timestamp since = 5;
  google.protobuf.Timestamp until = 6;
}

message AccountKeyAssertionResponse {
  string type = 1;
  string authority_id = 2;
  uint32 revision_sequence_number = 3;
  string public_key_sha3_384 = 4;
  string account_id = 5;
  string name = 6;
  google.protobuf.Timestamp since = 7;
  google.protobuf.Timestamp until = 8;
  string sign_key_sha3_384 = 9;
  string id = 10;

  bytes body = 11;
  uint64 body_length = 12;

  string signature = 13;

  repeated proto.Error errors = 14;
}

message GetSnapRevisionAssertionBySHA3_384Request {
  string snap_sha3_384 = 1;
}

message GetAccountKeyAssertionByNameRequest {
  string name = 1;
}

message AddSnapDeclarationAssertionRequest {
  uint32 series  = 1;
  string snap_id = 2;
  string snap_name = 3;
  string publisher_id = 4;
  google.protobuf.Timestamp timestamp = 5;
  repeated string refresh_control = 6;
  repeated Alias aliases = 7;
  map<string, PlugRule> plugs = 8;
  map<string, SlotRule> slots = 9;
}

message SnapDeclarationAssertionResponse {
  string id = 1;
  string type = 2;
  string authority_id = 3;
  uint32 revision = 4;
  uint32 series = 5;
  string snap_id = 6;
  string snap_name = 7;
  string publisher_id = 8;
  google.protobuf.Timestamp timestamp = 9;
  repeated string refresh_control = 10;
  repeated Alias aliases = 11;
  map<string, PlugRule> plugs = 12;
  map<string, SlotRule> slots = 13;
  string sign_key_sha3_384 = 14;
  string signature = 15;
  repeated proto.Error errors = 16;
}

message PlugRule {
  optional bool allow_installation    = 1;
  optional bool deny_installation     = 2;
  optional bool allow_connection      = 3;
  optional bool deny_connection       = 4;
  optional bool allow_auto_connection = 5;
  optional bool deny_auto_connection  = 6;
}

message SlotRule {
  optional bool allow_installation    = 1;
  optional bool deny_installation     = 2;
  optional bool allow_connection      = 3;
  optional bool deny_connection       = 4;
  optional bool allow_auto_connection = 5;
  optional bool deny_auto_connection  = 6;
}

message Alias {
  string name = 1;
  string target = 2;
}

message GetSnapDeclarationAssertionBySnapIDRequest {
  string snap_id = 1;
  uint32 revision = 2;
}

message AddAccountAssertionRequest {
  string account_id = 1;
  string display_name = 2;
  string username = 3;
  string validation = 4;
  google.protobuf.Timestamp timestamp = 5;
}

message AccountAssertionResponse {
  string id = 1;
  string type = 2;
  string authority_id = 3;
  uint32 revision = 4;
  string account_id = 5;
  string display_name = 6;
  string username = 7;
  string validation = 8;
  google.protobuf.Timestamp timestamp = 9;
  string sign_key_sha3_384 = 10;
  string signature = 11;

  repeated proto.Error errors = 12;
}

message GetAccountAssertionByAccountIDRequest {
  string account_id = 1;
}

