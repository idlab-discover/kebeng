global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape each of your Go services on its /metrics endpoint
  - job_name: 'gateway'
    static_configs:
      - targets: ['gateway:9100']

  - job_name: 'store_service'
    static_configs:
      - targets: ['store_service:9100']

  - job_name: 'account_service'
    static_configs:
      - targets: ['account_service:9100']

  - job_name: 'assertion_service'
    static_configs:
      - targets: ['assertion_service:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    metric_relabel_configs:
      # keep only the labels we truly need:
      - action: labelkeep
        regex: '__name__|instance|job|container_label_com_docker_compose_service|cpu|le'
      # rename the compose label to "service"
      - action: labelmap
        regex: 'container_label_com_docker_compose_service'
        replacement: 'service'
  
  - job_name: 'monitoring'
    metrics_path: /metrics
    static_configs:
      - targets: ['monitoring:9100']
