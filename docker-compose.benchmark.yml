services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - kebeng-backend
    depends_on:
      - gateway
      - store_service
      - account_service
      - assertion_service

  monitoring:
    build:
      context: ./services/monitoring
      dockerfile: Dockerfile.monitoring
    ports:
      - "3030:8080"
    depends_on:
      - prometheus
    volumes:
      - ./services/monitoring/config.yaml:/app/config.yaml
      - ./test-data/minio:/app/test-data
      - ./monitoring_data/:/var/log # logs are put in the monitoring_data folder !!! this folder has to exists !!!
    environment:
      - CONFIG_FILE_PATH=/app/config.yaml
    restart: always
    networks:
      - kebeng-backend

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    command:
      - --docker_only=true          # <— skip all raw cgroup/overlayfs probing
      - --housekeeping_interval=1s
    ports:
    - 3031:8080
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:rw
    - /sys:/sys:ro
    - /var/lib/docker/:/var/lib/docker:ro
    restart: always
    networks:
      - kebeng-backend

  gateway:
    build: 
      context: ./services/gateway
      dockerfile: Dockerfile.gateway
    ports:
      - "8080:8080"
      - "6060:6060"  # for pprof
    depends_on:
      - store_service
      - account_service
      - minio
      - store_db
      - account_db
    volumes:
      - ./services/gateway/config.yaml:/app/config.yaml  # config file
      - ./test-data:/app/test-data 
    environment:
      - CONFIG_FILE_PATH=/app/config.yaml
      - TEST_MODE=1
    restart: always
    networks: 
      - kebeng-backend

  store_service:
    build: 
      context: ./services/store
      dockerfile: Dockerfile.store
    ports:
      - "8081:8081"
      - "6061:6060"  # for pprof
    depends_on:
      - store_db
      - minio
    volumes:
      - ./services/store/config.yaml:/app/config.yaml  # config file
    environment:
      - CONFIG_FILE_PATH=/app/config.yaml
      - TEST_MODE=1
    restart: always
    networks: 
      - kebeng-backend

  store_db:
    image: postgres:13
    restart: always
    volumes:
      - store_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=store_db
      - POSTGRES_USER=kebe_user
      - POSTGRES_PASSWORD=kebe
    ports:
      - "5432:5432"
    networks: 
      - kebeng-backend

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    restart: always
    networks: 
      - kebeng-backend

  account_service:
    build: 
      context: ./services/account
      dockerfile: Dockerfile.account
    ports:
      - "8082:8082"
      - "6062:6060"  # for pprof
    depends_on:
      - account_db
    volumes:
      - ./services/account/config.yaml:/app/config.yaml  # config file
    environment:
      - CONFIG_FILE_PATH=/app/config.yaml
      - TEST_MODE=1
    restart: always
    networks: 
      - kebeng-backend

  account_db:
    image: postgres:13
    restart: always
    volumes:
      - account_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=account_db
      - POSTGRES_USER=kebe_user
      - POSTGRES_PASSWORD=kebe
    ports:
      - "5433:5432"
    networks: 
      - kebeng-backend

  assertion_service:
    build: 
      context: ./services/assertion
      dockerfile: Dockerfile.assertion
    ports:
      - "8083:8083"
      - "6063:6060"  # for pprof
    depends_on:
      - assertion_mongo_db
    volumes:
      - ./services/assertion/config.yaml:/app/config.yaml  # config file
      - ./services/assertion/keys/:/app/keys/  # TODO: this path should become a variable instead of hardcoded

    environment:
      - CONFIG_FILE_PATH=/app/config.yaml
      - TEST_MODE=1
    restart: always
    networks: 
      - kebeng-backend
  
  assertion_mongo_db:
    image: mongo:latest
    restart: always
    volumes:
      - assertion_data:/data/db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    networks:
      - kebeng-backend
    command: mongod --quiet --logpath /dev/null

volumes:
  store_data:
  minio_data:
  account_data:
  assertion_data:
  grafana_data:

networks:
  kebeng-backend:
    driver: bridge
    name: kebeng-backend
